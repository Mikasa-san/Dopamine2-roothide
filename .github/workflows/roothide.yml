name: "*** build tipa file ***"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-13
    env:
      BASEDIR: ${{ github.workspace }}
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Procursus
        id: cache-proc
        uses: actions/cache@v3
        with:
          path: /opt/procursus
          key: procursus-${{ runner.os }}-pkgs

      - name: Install Procursus if needed
        if: steps.cache-proc.outputs.cache-hit != 'true'
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Cache THEOS directory
        id: cache-theos
        uses: actions/cache@v3
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-sdk16.5

      - name: Bootstrap THEOS & iPhoneOS16.5 SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${THEOS}"
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o install-theos.sh
          bash install-theos.sh
          mkdir -p "${THEOS}/sdks"
          touch "${THEOS}/sdks/sdk"
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJ -C "${THEOS}/sdks"

      - name: Cache trustcache source & binary
        id: cache-tc
        uses: actions/cache@v3
        with:
          path: trustcache
          key: trustcache-${{ runner.os }}

      - name: Build & install trustcache
        run: |
          if [ ! -d trustcache ]; then
            git clone https://github.com/CRKatri/trustcache trustcache
          fi
          cd trustcache
          if [ ! -f trustcache ]; then
            gmake -j$(sysctl -n hw.physicalcpu) OPENSSL=1
          fi
          sudo cp trustcache /opt/procursus/bin/

      - name: Build Dopamine2-roothide and package .tipa
        run: |
          export T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          export TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          export SHASH=$(git rev-parse --short HEAD)

          itemcount=$(plutil -extract items raw -expect array \
            ./Application/Dopamine/UI/Settings/Credits.plist)
          for ((i=0; i<$itemcount; i++)); do
            hdr=$(plutil -extract items.$i.headerCellClass raw \
              ./Application/Dopamine/UI/Settings/Credits.plist)
            if [ "$hdr" = "DOCreditsCell" ]; then
              idx=$i
              break
            fi
          done

          plutil -insert items.$idx.names -xml \
            "<dict><key>name</key><string>${{ github.actor }}</string>\
            <key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" \
            -append ./Application/Dopamine/UI/Settings/Credits.plist

          gmake -j$(sysctl -n hw.physicalcpu) NIGHTLY=0
          mv ./Application/Dopamine.tipa \
             "./Application/roothide-Dopamine2.tipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roothide-Dopamine2.tipa
          path: Application/roothide-Dopamine2.tipa
