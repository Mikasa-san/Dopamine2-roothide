name: "*** build tipa file ***"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14   # ARM64-only runner

    steps:
      - name: Select Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Checkout Dopamine2-roothide
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache THEOS SDKs
        uses: actions/cache@v4
        id: cache-theos
        with:
          path: theos/sdks
          key: ${{ runner.os }}-theos-sdks-16.5
          restore-keys: |
            ${{ runner.os }}-theos-sdks-

      - name: Install Procursus
        uses: beerpiss/procursus-action@v2
        with:
          packages: ldid findutils sed coreutils make
          cache: true

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Install OpenSSL & Dependencies
        run: |
          brew install openssl@1.1 gettext libarchive make
          # Make (GNU make) is installed as `gmake` :contentReference[oaicite:0]{index=0}
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"

      - name: Overwrite Procursus libintl with ARM64
        run: |
          # Ensure any Procursus tools that depend on libintl get the ARM64 version
          sudo cp "$(brew --prefix gettext)/lib/libintl.8.dylib" /opt/procursus/lib/libintl.8.dylib

      - name: Build and Install trustcache
        run: |
          set -x
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          OPENSSL_PREFIX="$(brew --prefix openssl@1.1)"
          export CFLAGS="-arch arm64 -I${OPENSSL_PREFIX}/include"
          export LDFLAGS="-arch arm64 -L${OPENSSL_PREFIX}/lib"
          export CC="clang"
          # Use Homebrew’s gmake (GNU make) instead of Procursus’s gmake
          gmake -j"$(sysctl -n hw.physicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Build Dopamine2-roothide
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          itemcount=$(plutil -extract items raw -expect array \
            "./Application/Dopamine/UI/Settings/Credits.plist")
          for ((i=0; i<itemcount; i++)); do
            if [ "$(plutil -extract items.$i.headerCellClass raw \
                "./Application/Dopamine/UI/Settings/Credits.plist")" = "DOCreditsCell" ]; then
              DOCreditsCellIndex=$i
            fi
          done
          plutil -insert items.$DOCreditsCellIndex.names -xml \
            "<dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict>" \
            -append "./Application/Dopamine/UI/Settings/Credits.plist"
          gmake -j"$(sysctl -n hw.physicalcpu)" NIGHTLY=0
          mv "./Application/Dopamine.tipa" "./Application/roothide-Dopamine2.tipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roothide-Dopamine2.tipa
          path: Application/roothide-Dopamine2.tipa
